[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cleaner"
version = "1.0.0"
description = "پاک‌سازی جمله‌های هوش مصنوعی از مقاله‌ها — فقط جمله‌های الگودار، دسته‌به‌دسته"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ai_cleaner"]

[tool.setuptools.package-data]
ai_cleaner = ["patterns.yaml"]
