name: Release content audit plugin

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "wp-content/plugins/sa-content-audit/**"
      - ".github/workflows/release-content-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-audit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    name: Validate, package and publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PLUGIN_DIR: wp-content/plugins/sa-content-audit
      PLUGIN_SLUG: sa-content-audit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m 1 'Version:' "$PLUGIN_DIR/sa-content-audit.php" | sed -E 's/^.*Version:[[:space:]]*//' | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=sa-content-audit-v$version" >> "$GITHUB_OUTPUT"
          echo "asset=sa-content-audit-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Lint PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find "$PLUGIN_DIR" -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          node --check "$PLUGIN_DIR/assets/admin.js"

      - name: Check existing release and version immutability
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PLUGIN_DIR: wp-content/plugins/sa-content-audit
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if ! git diff --quiet "refs/tags/$TAG" -- "$PLUGIN_DIR"; then
              echo "Plugin code changed without a version bump; $TAG points to different files." >&2
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              published="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
              if [[ "$published" -gt 0 ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "tag_exists=true" >> "$GITHUB_OUTPUT"
                echo "release_exists=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP and checksum
        if: steps.existing.outputs.skip != 'true'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/package
          cp -a "$PLUGIN_DIR" "release/package/$PLUGIN_SLUG"
          (cd release/package && zip -X -q -r "../$ASSET" "$PLUGIN_SLUG")
          unzip -t "release/$ASSET"
          printf '%s  %s\n' "$(sha256sum "release/$ASSET" | awk '{print $1}')" "$ASSET" > "release/$ASSET.sha256"

      - name: Publish GitHub release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.existing.outputs.release_exists }}
        shell: bash
        run: |
          set -euo pipefail
          title="ممیزی محتوای سرزمین آریان — v$VERSION"
          notes="افزونهٔ نصب‌پذیر فارسی با ممیزی در صفحهٔ ویرایش و گزارش کلی. امتیازها معیار داخلی تحریریه‌اند، نه نمرهٔ رسمی گوگل. ایندکس واقعی، وضعیت HTTP لینک‌های بیرونی، سرقت ادبی بیرونی و تولید هوش مصنوعی قطعی تشخیص داده نمی‌شوند."
          if [[ "$RELEASE_EXISTS" == 'true' ]]; then
            gh release upload "$TAG" "release/$ASSET" "release/$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$TAG_EXISTS" == 'true' ]]; then
            gh release create "$TAG" "release/$ASSET#بسته نصب افزونه" "release/$ASSET.sha256#SHA-256" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" "release/$ASSET#بسته نصب افزونه" "release/$ASSET.sha256#SHA-256" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$ASSET" >/dev/null
