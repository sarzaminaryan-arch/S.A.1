name: Release child theme

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "wp-content/themes/sarzaminaryan-child/**"
      - ".github/workflows/release-child-theme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child-theme-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    name: Validate, package and publish
    runs-on: ubuntu-latest
    env:
      THEME_DIR: wp-content/themes/sarzaminaryan-child
      THEME_SLUG: sarzaminaryan-child
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version:[[:space:]]*//p' "$THEME_DIR/style.css" | head -n 1 | tr -d '\r')"
          php_version="$(sed -n "s/^define( 'SA_CHILD_VERSION', '\([^']*\)' );$/\1/p" "$THEME_DIR/functions.php" | head -n 1)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid theme version: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$php_version" ]]; then
            echo "style.css version ($version) and SA_CHILD_VERSION ($php_version) differ." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=sarzaminaryan-child-v$version" >> "$GITHUB_OUTPUT"
          echo "asset=sarzaminaryan-child-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find "$THEME_DIR" -type f -name '*.php' -print0 \
            | xargs -0 -n 1 php -l

      - name: Reject accidentally committed credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude='github-updater.php' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,})' "$THEME_DIR"; then
            echo 'A value resembling a GitHub token was found in the theme.' >&2
            exit 1
          fi

      - name: Check whether this version is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if ! git diff --quiet "refs/tags/$TAG" -- "$THEME_DIR"; then
              echo "Theme code changed without a version bump; $TAG already points to different theme files." >&2
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$TAG already contains these theme files; nothing to publish."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP and checksum
        if: steps.existing.outputs.skip != 'true'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/package
          cp -a "$THEME_DIR" "release/package/$THEME_SLUG"
          (
            cd release/package
            zip -X -q -r "../$ASSET" "$THEME_SLUG"
          )
          unzip -t "release/$ASSET"
          printf '%s  %s\n' "$(sha256sum "release/$ASSET" | awk '{print $1}')" "$ASSET" \
            > "release/$ASSET.sha256"

      - name: Publish GitHub release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            "release/$ASSET#بسته نصب قالب فرزند"
            "release/$ASSET.sha256#SHA-256"
            --repo "$GITHUB_REPOSITORY"
            --title "قالب فرزند سرزمین آریان — v$VERSION"
            --notes "انتشار خودکار قالب فرزند نسخهٔ $VERSION. فایل ZIP با ساختار استاندارد وردپرس بسته‌بندی و PHP آن بررسی شده است."
          )
          if [[ "$TAG_EXISTS" == 'true' ]]; then
            gh release create "${args[@]}" --verify-tag
          else
            gh release create "${args[@]}" --target "$GITHUB_SHA"
          fi
