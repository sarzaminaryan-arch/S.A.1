name: Lint debug (temporary)

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/lint-debug.yml"

permissions:
  contents: write

concurrency:
  group: lint-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run theme tests individually and capture output
        shell: bash
        run: |
          set +e
          THEME_DIR=wp-content/themes/sarzaminaryan-child
          {
            php -v | head -1
            for t in internal-links publish-gate education-nav entity-bars media-restore featured-images article-cards responsive-tables toc county-profile ready-guides ready-covers; do
              f="$THEME_DIR/tests/test-$t.php"
              if [ -f "$f" ]; then
                echo "=== $t ==="
                out="$(timeout 60 php "$f" 2>&1)"
                code=$?
                echo "exit=$code"
                echo "$out" | tail -25
              fi
            done
            echo "--- done ---"
          } > lint-debug.txt 2>&1

      - name: Push report back to the branch
        shell: bash
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add lint-debug.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(ci): گزارش موقت خروجی آزمون‌های قالب [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
