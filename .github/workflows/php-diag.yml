name: PHP test diagnostics (temporary)

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/php-diag.yml"

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the failing test and capture everything
        env:
          THEME_DIR: wp-content/themes/sarzaminaryan-child
        run: |
          set +e
          {
            echo "php: $(php -v | head -n 1)"
            echo "pcre backtrack limit: $(php -r 'echo ini_get("pcre.backtrack_limit");')"
            echo "--- test run ---"
            php "$THEME_DIR/tests/test-body-strip.php"
            echo "exit=$?"
          } > php-diag.txt 2>&1
          cat php-diag.txt
      - name: Commit diagnostics
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add php-diag.txt
          git commit -m "diag: body-strip test output" || true
          git push
