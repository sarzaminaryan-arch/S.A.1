name: WP agent (direct WordPress — drafts only, backup first)

# The agent's direct line to the live site (theme 2.22.72+, /wp-json/sa-agent/v1).
# The Arena sandbox cannot reach sarzaminaryan.ir, so the agent pushes a job file
# and this runner (which can reach the site) executes it with the owner's secrets.
#
# Job file: tools/wp-agent/jobs/<name>.json  →  result: tools/wp-agent/results/<name>.json
#   {"note": "...", "steps": [ {"cmd": "ping"},
#                              {"cmd": "draft", "title": "...", "content_file": "tools/wp-agent/outbox/x.html"} ]}
# A job runs once: any job that already has a result file is skipped.
# `not_before` (ISO UTC) defers a job to a later run; `rollback_on_fail` restores every
# backup the job made when a step fails or a post-change probe is unhealthy.
# Steps stop at the first refusal. Server and runner both back up before every change;
# the runner's local backups are uploaded as a private artifact (90 days).
#
# Secrets (owner adds them in Settings → Secrets and variables → Actions; never in chat):
#   SA_SITE_URL      e.g. https://sarzaminaryan.ir
#   SA_USER          WordPress username that owns the Application Password
#   SA_APP_PASSWORD  the Application Password

# Production credentials must not be used on unreviewed branch pushes or schedules.
# Dispatch only from main after the job has been reviewed and merged.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Reviewed job on main (tools/wp-agent/jobs/<name>.json)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: wp-agent
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets are set
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          SA_SITE_URL: ${{ secrets.SA_SITE_URL }}
          SA_USER: ${{ secrets.SA_USER }}
          SA_APP_PASSWORD: ${{ secrets.SA_APP_PASSWORD }}
        run: |
          missing=""
          [ -n "$SA_SITE_URL" ] || missing="$missing SA_SITE_URL"
          [ -n "$SA_USER" ] || missing="$missing SA_USER"
          [ -n "$SA_APP_PASSWORD" ] || missing="$missing SA_APP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (owner: Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: "Self-test: tool compiles and content audit logic"
        run: |
          python3 -m py_compile tools/wp-agent/wp_agent.py tools/wp-agent/content_audit.py tools/wp-agent/content_fix.py tools/wp-agent/build_replace_batch.py
          python3 tools/wp-agent/test_content_audit.py
          python3 tools/wp-agent/test_content_fix.py
          python3 tools/wp-agent/test_wp_agent_jobs.py
          python3 tools/wp-agent/test_workflow_safety.py
          python3 tools/wp-agent/test_build_gate.py
          python3 tools/wp-agent/test_fa_lint.py
          python3 tools/wp-agent/test_wp_agent_probe.py
          python3 tools/wp-agent/test_build_replace_batch.py
          python3 tools/wp-agent/test_build_section_batch.py
          python3 tools/wp-agent/test_county_template.py
          python3 tools/photos/test_import_photos.py

      # Fail closed unless the exact main commit's Build gates push run already succeeded.
      - name: Verify build gates for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          GATE_REPOSITORY: ${{ github.repository }}
        run: python3 tools/wp-agent/check_build_gate.py

      - name: Run pending jobs
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          SA_SITE_URL: ${{ secrets.SA_SITE_URL }}
          SA_USER: ${{ secrets.SA_USER }}
          SA_APP_PASSWORD: ${{ secrets.SA_APP_PASSWORD }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          set -u
          status=0
          if [[ ! "${INPUT_JOB:-}" =~ ^tools/wp-agent/jobs/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "::error::job must be a single tools/wp-agent/jobs/<name>.json file"; exit 1
          fi
          jobs="$INPUT_JOB"
          ran=0
          for job in $jobs; do
            name=$(basename "$job")
            if [ -f "tools/wp-agent/results/$name" ]; then
              echo "skip $job (already has a result)"
              continue
            fi
            echo "::group::run $job"
            python3 tools/wp-agent/wp_agent.py run-job "$job" || status=1
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "jobs run: $ran"
          exit $status

      # v2.22.120: این فایل‌های محلی فقط «پیش-تصویرِ وضع قبلی همان یک رکورد» هستند
      # (نه پشتیبان کل سایت). نگه‌داری ۹۰ روز حجم رانر را بی‌دلیل می‌خورد؛ ۱۴ روز
      # کافی است، چون بازگشت واقعی از تاریخ گیت و پشتیبان افتراقی سمت سایت می‌آید.
      - name: Upload runner-side pre-write snapshots (private artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-agent-backups-${{ github.run_id }}
          path: backup/agent/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit results back to the branch
        if: always()
        run: |
          if [ -z "$(git status --porcelain tools/wp-agent/results tools/photos/results 2>/dev/null)" ]; then
            echo "no new results"
            exit 0
          fi
          git config user.name "wp-agent[bot]"
          git config user.email "wp-agent@users.noreply.github.com"
          git add tools/wp-agent/results tools/photos/results
          git commit -m "wp-agent: results of run ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
