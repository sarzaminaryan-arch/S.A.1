name: Release SEO meta fix plugin

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "wp-content/plugins/sa-seo-meta-fix/**"
      - "tools/build-seo-meta-fix-plugin.py"
      - "docs/live-site/seo-meta-fix-list.md"
      - ".github/workflows/release-seo-meta-fix-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-meta-fix-plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    name: Validate, package and publish plugin
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PLUGIN_DIR: wp-content/plugins/sa-seo-meta-fix
      PLUGIN_SLUG: sa-seo-meta-fix
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' "$PLUGIN_DIR/$PLUGIN_SLUG.php" | head -n 1 | tr -d '\r' | awk '{print $1}')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=seo-meta-fix-v$version" >> "$GITHUB_OUTPUT"
          echo "asset=sa-seo-meta-fix-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Lint PHP and run guarded-update tests
        shell: bash
        run: |
          set -euo pipefail
          find "$PLUGIN_DIR" -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          php "$PLUGIN_DIR/tests/test-plugin.php"

      - name: Check whether this version is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if ! git diff --quiet "refs/tags/$TAG" -- "$PLUGIN_DIR" tools/build-seo-meta-fix-plugin.py docs/live-site/seo-meta-fix-list.md; then
              echo "Plugin files changed without a version bump; $TAG already points to different files." >&2
              exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              published="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
              if [[ "${published:-0}" -gt 0 ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
                echo "tag_exists=true" >> "$GITHUB_OUTPUT"
                echo "release_exists=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP and checksum
        if: steps.existing.outputs.skip != 'true'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python3 tools/build-seo-meta-fix-plugin.py "release/$ASSET"
          unzip -t "release/$ASSET"
          unzip -l "release/$ASSET" "$PLUGIN_SLUG/$PLUGIN_SLUG.php" >/dev/null
          printf '%s  %s\n' "$(sha256sum "release/$ASSET" | awk '{print $1}')" "$ASSET" > "release/$ASSET.sha256"

      - name: Publish GitHub release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        shell: bash
        run: |
          set -euo pipefail
          echo "TAG=$TAG TAG_EXISTS=$TAG_EXISTS ASSET=$ASSET"
          ls -l release/
          notes="افزونهٔ یک‌بارمصرف فاز ۳ برای اصلاح امن ۱۵ فیلد عنوان/متای سئو در شش راهنما. نصب از «افزونه‌ها ← افزودن ← بارگذاری افزونه» و فعال‌سازی کافی است؛ اصلاح نگهبان‌دار هنگام فعال‌سازی اجرا می‌شود. گزارش و بازگردانی: «ابزارها ← اصلاح متای سئو (یک‌باره)». پس از تأیید با افزونهٔ ممیزی، این افزونه را غیرفعال و حذف کنید."
          publish() {
            if [[ "$TAG_EXISTS" != 'true' ]]; then
              gh release create "$TAG" "release/$ASSET" "release/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "افزونه یک‌بارمصرف اصلاح متادیتای سئو — v$VERSION" \
                --notes "$notes"
            elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" "release/$ASSET" "release/$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" "release/$ASSET" "release/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "افزونه یک‌بارمصرف اصلاح متادیتای سئو — v$VERSION" \
                --notes "$notes"
            fi
          }
          if ! publish >publish.log 2>&1; then
            echo "::error title=Publish failed::$(tail -c 1500 publish.log | tr '\n' ' ')"
            cat publish.log
            exit 1
          fi
          cat publish.log
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$ASSET" >/dev/null
