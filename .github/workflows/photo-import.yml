name: Photo import (licensed, attributed)

# تصاویر مکان‌ها با مجوز آزاد و نام عکاس (قالب ۲.۲۲.۹۸+).
#
# چرا این گردش‌کار جدا از wp-agent است: سندباکس ایجنت به دامنه‌های تصویری
# (upload.wikimedia.org) دسترسی ندارد، ولی رانر گیت‌هاب دارد. ورودی‌های
# tools/photos/<batch>.json همان چیزی است که ایجنت نوشته و مجوز هرکدام را
# از صفحهٔ فایل در ویکی‌مدیا بررسی کرده؛ رانر فقط همان‌ها را به
# POST /wp-json/sa-agent/v1/photos/import می‌دهد و سایت خودش فایل را می‌گیرد،
# مجوز و نام عکاس را *پیش از* ذخیره بررسی می‌کند و پرووننس را ثبت می‌کند.
#
# نتیجه در tools/photos/results/<batch>.json نوشته و به شاخه کامیت می‌شود.

on:
  # Import runs through the agent job (tools/wp-agent/jobs/*.json) so the theme update
  # and the photo batch are one transaction. A manual dispatch is the only other trigger:
  # a push trigger would fire for every batch file the agent commits, before the theme
  # that understands /photos/import is live on the site.
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch file inside the repository (tools/photos/<name>.json)"
        required: true
        type: string
      review_only:
        description: "Review Commons originals in an artifact; do not contact WordPress"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: photo-import
  cancel-in-progress: false

jobs:
  review:
    if: ${{ inputs.review_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make a visual proof from the named originals (no WP credentials)
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          python3 -m venv "$RUNNER_TEMP/review-env"
          "$RUNNER_TEMP/review-env/bin/pip" install 'Pillow>=11,<14'
          "$RUNNER_TEMP/review-env/bin/python" tools/photos/review_originals.py "$BATCH" "$RUNNER_TEMP/photo-review"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commons-photo-review
          path: ${{ runner.temp }}/photo-review/
          retention-days: 3
          if-no-files-found: ignore

  # Keep a compact, attributable proof on the editorial branch: artifact
  # downloads expire, but later reviewers must be able to check the subjects.
  record-review:
    needs: review
    if: ${{ always() && inputs.review_only && startsWith(github.ref, 'refs/heads/arena/') && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: commons-photo-review
          path: ${{ runner.temp }}/proof
      - name: Record only the review sheets and the matching attribution table
        env:
          BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          [[ "$BATCH" =~ ^tools/photos/([A-Za-z0-9_-]+)\.json$ ]]
          dest="tools/photos/reviews/${BASH_REMATCH[1]}"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/proof/credits.json" "$RUNNER_TEMP"/proof/proof-*.jpg "$dest/"
          git add -- "$dest"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'photo-review[bot]'
          git config user.email 'photo-review[bot]@users.noreply.github.com'
          git commit -m "Record the Commons subject and credit proof for ${dest##*/}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  import:
    if: ${{ !inputs.review_only }}
    name: Import licensed photos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check secrets are set
        env:
          SA_SITE_URL: ${{ secrets.SA_SITE_URL }}
          SA_USER: ${{ secrets.SA_USER }}
          SA_APP_PASSWORD: ${{ secrets.SA_APP_PASSWORD }}
        run: |
          missing=""
          [ -n "$SA_SITE_URL" ] || missing="$missing SA_SITE_URL"
          [ -n "$SA_USER" ] || missing="$missing SA_USER"
          [ -n "$SA_APP_PASSWORD" ] || missing="$missing SA_APP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # v2.22.116: هر عکس شهرستان ۴:۳ و WebP زیر ۱۰۰ کیلوبایت است. Pillow همین‌جا
      # نصب می‌شود تا پروندهٔ مالک *پیش از* آپلود به همان قالب تبدیل شود؛ اگر نصب
      # نشود، ابزار فایل را دست‌نخورده می‌فرستد و خودِ سایت تبدیل می‌کند.
      - name: WebP toolchain (4:3, under 100 KB)
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/photo-env"
          "$RUNNER_TEMP/photo-env/bin/pip" install 'Pillow>=11,<14'

      - name: Import batches
        env:
          SA_SITE_URL: ${{ secrets.SA_SITE_URL }}
          SA_USER: ${{ secrets.SA_USER }}
          SA_APP_PASSWORD: ${{ secrets.SA_APP_PASSWORD }}
          INPUT_BATCH: ${{ inputs.batch }}
        run: |
          set -u
          status=0
          if [ -n "${INPUT_BATCH:-}" ]; then
            batches="$INPUT_BATCH"
          else
            batches=$(ls tools/photos/*.json 2>/dev/null | grep -v '/results/' || true)
          fi
          for batch in $batches; do
            name=$(basename "$batch" .json)
            if [ -f "tools/photos/results/$name.json" ]; then
              echo "skip $batch (already has a result)"
              continue
            fi
            echo "::group::import $batch"
            if [ -x "$RUNNER_TEMP/photo-env/bin/python" ]; then
              "$RUNNER_TEMP/photo-env/bin/python" tools/photos/import_photos.py "$batch" || status=1
            else
              python3 tools/photos/import_photos.py "$batch" || status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Commit results back to the branch
        if: always()
        run: |
          if [ -z "$(git status --porcelain tools/photos/results 2>/dev/null)" ]; then
            echo "no new results"
            exit 0
          fi
          git config user.name "wp-agent[bot]"
          git config user.email "wp-agent@users.noreply.github.com"
          git add tools/photos/results
          git commit -m "photo import: results of run ${{ github.run_id }}"
          git push origin "HEAD:${{ github.ref_name }}"
