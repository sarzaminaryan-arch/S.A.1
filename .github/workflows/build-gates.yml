name: Build gates (heavy work on the runner, never on the site)

# چرا این گردش‌کار (دستور مالک، ۲۸ آبان ۱۴۰۵): هاست سایت سقف حجم دارد و هر بار که
# «سنگین» روی سرور اجرا شود (تولید متن، فیلتر املا، نگهبان قالب، بهینه‌سازی تصویر،
# تست چیدمان) هم زمانِ سرور گرفته می‌شود و هم جای حجم. از این پس:
#
#   commit در گیت‌هاب → همین گردش‌کار: فیلترها + نگهبان‌ها + بیلد خروجی (artifact)
#   → کار wp-agent فقط انتشار همان خروجی (و فقط رکوردهای تغییریافته) را انجام می‌دهد.
#
# هیچ رمز وردپرس در این گردش‌کار نیست و هیچ درخواستی به سایت زده نمی‌شود. اگر این
# گردش‌کار قرمز باشد، انتشار نباید انجام شود (gate:publish).

on:
  push:
    branches:
      - main
      - "arena/**"
    # Every main commit must have a gate run, including job-only and result commits.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Persian lint + county template + photo rules (offline)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cleaner test dependencies
        run: python3 -m pip install ".[test]"

      - name: Cleaner regression tests
        run: python3 -m pytest -q

      - name: PHP runtime for the theme guards
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends php-cli

      - name: Byte-compile every tool
        run: |
          python3 -m py_compile tools/wp-agent/*.py
          python3 -m py_compile tools/wp-agent/replace_src/*.py
          python3 -m py_compile tools/photos/*.py

      - name: 'Persian spelling filter (ماه میلادی، نیم‌فاصله، حروف عربی، ارقام عربی)'
        run: python3 tools/wp-agent/test_fa_lint.py

      - name: County template guard (order, retired sections, word floor)
        run: python3 tools/wp-agent/test_county_template.py
      - name: Featured-image fallback card (v2.22.144)
        run: php wp-content/themes/sarzaminaryan-child/tests/test-fallback-card.php

      - name: County section registry (v2.22.145)
        run: php wp-content/themes/sarzaminaryan-child/tests/test-county-sections.php

      - name: Collapsible county identity card on mobile (v2.22.147)
        run: php wp-content/themes/sarzaminaryan-child/tests/test-identity-fold.php

      - name: Changed county detection regression tests
        run: python3 tools/wp-agent/test_changed_counties.py

      - name: Agent job safety (not_before, rollback_on_fail, step → argv)
        run: python3 tools/wp-agent/test_wp_agent_jobs.py

      - name: Production workflow and recovery safety regressions
        run: |
          python3 tools/wp-agent/test_ci_coverage.py
          python3 tools/wp-agent/test_workflow_safety.py
          python3 tools/wp-agent/test_build_gate.py
          python3 tools/wp-agent/test_job_exception_recovery.py
          python3 tools/wp-agent/test_job_state_recovery.py

      - name: Licensed-photo rules (licence, author, host, 4:3 WebP under 100 KB)
        run: |
          python3 tools/photos/test_import_photos.py
          php wp-content/themes/sarzaminaryan-child/tests/test-county-media.php

      - name: Diff-backup and retention rules (v2.22.120)
        run: php wp-content/themes/sarzaminaryan-child/tests/test-agent-bridge.php

      - name: 'Agent ops guards (index gate, storage, prune, theme rollback)'
        run: php wp-content/themes/sarzaminaryan-child/tests/test-index-gate.php

  build:
    name: Build county pages changed in this push (artifact, no site contact)
    needs: guards
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the county data files touched by this push
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          slugs=$(python3 tools/wp-agent/changed_counties.py)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "county files changed: ${slugs:-none}"

      - name: Build + guard each changed county (no writes)
        if: steps.changed.outputs.slugs != ''
        shell: bash
        run: |
          set -euo pipefail
          for slug in ${{ steps.changed.outputs.slugs }}; do
            echo "::group::build $slug"
            python3 tools/wp-agent/replace_src/county_page.py "$slug"
            echo "::endgroup::"
          done

      - name: Guard every rebuilt page (check_template.py)
        if: steps.changed.outputs.slugs != ''
        shell: bash
        run: |
          set -euo pipefail
          for slug in ${{ steps.changed.outputs.slugs }}; do
            dir="tools/wp-agent/outbox/20261117-replace-$slug"
            test -n "$(find "$dir" -maxdepth 1 -name '*.html' -print -quit)"
            python3 tools/wp-agent/replace_src/check_template.py "$dir"
          done

      - name: Upload the ready-to-publish pages as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-pages-${{ github.run_id }}
          path: |
            tools/wp-agent/outbox/**
            tools/photos/results/**
          retention-days: 14
          if-no-files-found: ignore
