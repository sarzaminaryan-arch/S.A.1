name: Release Gahar Lake article importer

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "tools/importers/sa-gahar-lake-featured-view-importer/**"
      - ".github/workflows/release-gahar-lake-importer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gahar-lake-importer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    name: Package and publish importer
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: tools/importers/sa-gahar-lake-featured-view-importer
      PLUGIN_SLUG: sa-gahar-lake-featured-view-importer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' "$PLUGIN_DIR/$PLUGIN_SLUG.php" | head -n 1 | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$PLUGIN_SLUG-v$version" >> "$GITHUB_OUTPUT"
          echo "asset=$PLUGIN_SLUG-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find "$PLUGIN_DIR" -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; not republishing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable plugin ZIP and checksum
        if: steps.existing.outputs.skip != 'true'
        env:
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/package
          cp -a "$PLUGIN_DIR" "release/package/$PLUGIN_SLUG"
          (
            cd release/package
            zip -X -q -r "../$ASSET" "$PLUGIN_SLUG"
          )
          unzip -t "release/$ASSET"
          printf '%s  %s\n' "$(sha256sum "release/$ASSET" | awk '{print $1}')" "$ASSET" > "release/$ASSET.sha256"

      - name: Publish GitHub release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release/$ASSET#افزونه درون‌ریز مقاله دریاچه گهر" \
            "release/$ASSET.sha256#SHA-256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "افزونه درون‌ریز مقاله دریاچه گهر دورود — v$VERSION" \
            --notes "افزونه نصب‌پذیر وردپرس برای ساخت/به‌روزرسانی مقاله «نمای برتر دریاچه گهر دورود». پس از نصب و فعال‌سازی، از ردیف افزونه در صفحه افزونه‌ها روی «درون‌ریزی مقاله دریاچه گهر» کلیک کنید. افزونه متن کامل، فیلدهای شناسنامه، سئو، Rank Math، FAQ، منابع و تصویر شاخص کادر سفید را وارد می‌کند."
